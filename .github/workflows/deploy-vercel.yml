# Publica o site na Vercel (produção) a cada atualização na main.
# Precisa de 3 segredos no GitHub (Settings > Secrets and variables > Actions):
#   VERCEL_TOKEN       -> vercel.com/account/tokens
#   VERCEL_ORG_ID      -> Vercel > projeto > Settings > General ("Team ID" ou "Your ID")
#   VERCEL_PROJECT_ID  -> Vercel > projeto > Settings > General ("Project ID")
name: Publicar na Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-producao
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Conferir segredos
        id: segredos
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Faltam os segredos VERCEL_TOKEN, VERCEL_ORG_ID e/ou VERCEL_PROJECT_ID. Publicação pulada."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.segredos.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.segredos.outputs.ok == 'true'
        with:
          node-version: 20

      - name: Baixar configuração do projeto na Vercel
        if: steps.segredos.outputs.ok == 'true'
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Gerar o site
        if: steps.segredos.outputs.ok == 'true'
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Publicar em produção
        if: steps.segredos.outputs.ok == 'true'
        run: |
          URL=$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Publicado: $URL"
          echo "### Publicado na Vercel: $URL" >> "$GITHUB_STEP_SUMMARY"
